on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  # Upstream injects a real DSN from secrets. A fork has none, and the build only
  # requires the value to be well-formed, not valid.
  SENTRY_DSN: "https://public_key@example.com/project_id"

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      # The setup steps are inlined rather than pulled from
      # android-password-store/android-password-store/.github/reusable-workflows/setup-gradle,
      # so this fork's CI does not depend on the archived upstream repository.
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: always
          cache-cleanup: on-success
          validate-wrappers: true

      # Without this every run signs with the throwaway debug keystore the runner generates,
      # so no two CI builds -- and no CI build and local build -- can be installed over each
      # other. The secret is optional: forks and PRs without it still build, they just produce
      # APKs that cannot upgrade an existing install.
      - name: Restore signing key
        if: "${{ env.SIGNING_KEYSTORE != '' }}"
        env:
          SIGNING_KEYSTORE: "${{ secrets.SIGNING_KEYSTORE }}"
          SIGNING_KEY_ALIAS: "${{ secrets.SIGNING_KEY_ALIAS }}"
          SIGNING_KEY_PASSWORD: "${{ secrets.SIGNING_KEY_PASSWORD }}"
          SIGNING_STORE_PASSWORD: "${{ secrets.SIGNING_STORE_PASSWORD }}"
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/signing.jks"
          umask 077
          cat > keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/signing.jks
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          PROPS

      - name: Check codestyle
        run: ./gradlew spotlessCheck

      - name: Run unit tests
        run: ./gradlew test -PslimTests

      - name: Check library API
        run: ./gradlew metalavaCheckCompatibilityRelease

      - name: Build debug APKs
        run: ./gradlew assembleFreeDebug assembleNonFreeDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Remove signing key
        if: "${{ always() }}"
        run: rm -f keystore.properties "$RUNNER_TEMP/signing.jks"

      - name: (Fail-only) Upload test report
        if: "${{ failure() }}"
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            app/build/reports
            crypto/pgpainless/build/reports
