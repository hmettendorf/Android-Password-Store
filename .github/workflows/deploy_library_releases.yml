name: Release library subprojects
on:
  # Disabled for this fork: publishes to Maven Central; needs secrets.NEXUS_PUBLISH_*.
  # Left as manual-only so the definition is preserved; re-add triggers if needed.
  workflow_dispatch:

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
    - name: Setup build environment
      uses: android-password-store/android-password-store/.github/reusable-workflows/setup-gradle@develop

    - name: Upload binaries
      shell: bash
      run: ./gradlew --no-configuration-cache :autofill-parser:publishAllPublicationsToMavenCentralRepository
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.NEXUS_PUBLISH_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.NEXUS_PUBLISH_PASSWORD }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.NEXUS_PUBLISH_GPG_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.NEXUS_PUBLISH_GPG_KEY_PASSWORD }}
